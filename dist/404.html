<!DOCTYPE html><html class="dark overflow-x-hidden" lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>
        html,
        body {
            background-color: #030712;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            color: white;
            height: 100%;
            overflow: hidden;
        }

        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background: radial-gradient(circle at center, rgba(14, 165, 233, 0.15) 0%, transparent 70%);
            position: relative;
        }

        .error-code {
            font-size: 10rem;
            font-weight: 900;
            background: linear-gradient(to right, #0EA5E9, #3B82F6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1;
            filter: drop-shadow(0 0 30px rgba(14, 165, 233, 0.3));
        }

        .error-title {
            font-size: 2rem;
            font-weight: 700;
            margin: 1rem 0;
            color: #F8FAFC;
        }

        .error-message {
            font-size: 1.125rem;
            color: #94A3B8;
            max-width: 500px;
            margin-bottom: 2.5rem;
        }

        .home-button {
            background: linear-gradient(135deg, #0EA5E9 0%, #3B82F6 100%);
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 9999px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.4);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .home-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 35px -10px rgba(14, 165, 233, 0.5);
            filter: brightness(1.1);
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black, transparent 80%);
            z-index: -1;
        }

        .blur-blob {
            position: absolute;
            width: 400px;
            height: 400px;
            background: #0EA5E9;
            filter: blur(120px);
            opacity: 0.1;
            border-radius: 50%;
            z-index: -1;
            animation: float 10s infinite alternate;
        }

        @keyframes float {
            from {
                transform: translate(-20%, -20%) scale(1);
            }

            to {
                transform: translate(20%, 20%) scale(1.1);
            }
        }
    </style><title>404 - Page Not Found | Dalvi Consultancy</title><link rel="icon" href="logo.svg" type="image/png"></head><body><div class="error-container"><div class="bg-grid"></div><div class="blur-blob"></div><h1 class="error-code">404</h1><h2 class="error-title">Piece of Engineering Not Found</h2><p class="error-message">
            The module or page you are looking for has been moved, renamed, or perhaps never existed in this branch of
            the codebase.
        </p><a href="/" class="home-button">Back to Dashboard</a></div></body></html>
